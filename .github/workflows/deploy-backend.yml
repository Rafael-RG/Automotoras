name: Deploy Backend to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Automotoras.sln'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'backend/AutomotorasApi'
  TEST_PROJECT_PATH: 'backend/AutomotorasApi.Tests/AutomotorasApi.Tests.csproj'
  AZURE_FUNCTIONAPP_NAME: 'app-redautos-prod-001'

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Automotoras.sln

      - name: Build
        run: dotnet build Automotoras.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7C3F1312B87046F098525260A38C4B26 }}
          sku: flexconsumption
